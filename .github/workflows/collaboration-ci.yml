name: Collaboration CI

on:
  pull_request:
    paths:
      - ".github/workflows/collaboration-ci.yml"
      - "deploy/collaboration-private/**"
      - "packages/collaboration-*/**"
      - "packages/domains/collaboration/**"
      - "packages/domains/content-space/src/contract.ts"
      - "packages/domain-sdk/**"
      - "test-fixtures/collaboration/e-content-space-portable.mjs"
      - "scripts/collaboration-*.mjs"
      - "scripts/build-collaboration-server-bundle*.mjs"
      - "scripts/domain-packages.mjs"
      - "src/main/domain-*.ts"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - gui
    paths:
      - ".github/workflows/collaboration-ci.yml"
      - "deploy/collaboration-private/**"
      - "packages/collaboration-*/**"
      - "packages/domains/collaboration/**"
      - "packages/domains/content-space/src/contract.ts"
      - "packages/domain-sdk/**"
      - "test-fixtures/collaboration/e-content-space-portable.mjs"
      - "scripts/collaboration-*.mjs"
      - "scripts/build-collaboration-server-bundle*.mjs"
      - "scripts/domain-packages.mjs"
      - "src/main/domain-*.ts"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: collaboration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check contracts and package boundaries
        run: npm run collaboration:typecheck

      - name: Run collaboration production-path tests
        run: npm run collaboration:test

      - name: Validate private acceptance driver
        run: npm run collaboration:acceptance:test

      - name: Test immutable collaboration release builder
        run: npm run collaboration:bundle:test

      - name: Check private deployment shell syntax
        run: bash -n deploy/collaboration-private/scripts/*.sh deploy/collaboration-private/postgres-init/*.sh

      - name: Verify private deployment security policy
        run: deploy/collaboration-private/scripts/static-policy-test.sh

      - name: Verify generated composition and capabilities
        run: npm run capability:check

      - name: Build deployable collaboration server
        run: npm --workspace @sciforge/collaboration-server run build

      - name: Verify server package contents
        run: npm pack --workspace @sciforge/collaboration-server --dry-run

  portable-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sciforge-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build public collaboration contracts
        run: npm --workspace @sciforge/collaboration-contracts run build

      - name: Verify v1 to v6 migration and portable artifact round trip
        env:
          SCIFORGE_POSTGRES_V5_INTEGRATION: "1"
          SCIFORGE_POSTGRES_V5_ADMIN_URL: postgresql://postgres:sciforge-ci-only@127.0.0.1:5432/postgres
        run: npm --workspace @sciforge/collaboration-server test -- --run src/postgres-v5.integration.test.ts
